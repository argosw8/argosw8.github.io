"M474 454L522 558H567"/></g><g font-family="IBM Plex Mono,monospace" font-size="10" fill="#758698"><text x="91" y="56">SILICON DIE</text><text x="499" y="576">I/O PINS</text></g><text x="145" y="468" fill="#728176" font-size="8" font-family="IBM Plex Mono,monospace">AG / PERSONAL ARCHITECTURE</text><path d="M123 490L137 504H123Z" fill="#abc9ee"/><g fill="#717d72"><rect x="146" y="189" width="13" height="7"/><rect x="146" y="207" width="13" height="7"/><rect x="146" y="225" width="13" height="7"/><rect x="146" y="243" width="13" height="7"/><rect x="489" y="189" width="13" height="7"/><rect x="489" y="207" width="13" height="7"/><rect x="489" y="225" width="13" height="7"/><rect x="489" y="243" width="13" height="7"/></g></svg><div class="visual-caption"><span><i class="caption-line"></i>Illustrative processor cutaway</span><button id="pause" aria-pressed="false">Pause signals</button></div></div></main><footer class="bottom"><span class="bottom-left">CMU · Hardware / Software</span><div class="bottom-right"><div class="section-indicator" aria-label="Section navigation"><button data-go="overview" aria-label="Overview"></button><button data-go="work" aria-label="Work"></button><button data-go="about" aria-label="About"></button><button data-go="connect" aria-label="Connect"></button></div><button class="next" id="next">Next: Work</button></div></footer></div><dialog id="project-dialog"><div class="modal-header"><span id="modal-label">PROJECT NOTES</span><button class="close" id="close-dialog" aria-label="Close project details">×</button></div><div class="modal-content" id="project-content"></div></dialog><script>
const views=['overview','work','about','connect'];let active='overview',project='skimmer';const panel=document.querySelector('#panel');
const intro=`<div class="eyebrow">Carnegie Mellon · Computer architecture</div><h1>Arav Goswami.<br><span>Curious by<br>architecture.</span></h1><p class="description">I like understanding what happens <strong>beneath the software.</strong> How data moves. How hardware works. How the pieces become a system.</p><button class="primary" data-go="work"><span class="square" aria-hidden="true"></span>Explore my work</button><button class="quiet-link" data-go="about">Meet the person</button><p class="intro-foot">A personal portfolio.<br>Designed from the inside out.</p>`;
const projects={skimmer:{title:'Skimmer',tags:['FPGA','Dataflow','Signals'],description:'From FPGA compute to a ground receiver. A look at the path information takes through a system.',detail:`<h2>Skimmer</h2><p>FPGA compute and dataflow, alongside the signal-processing chain of a ground receiver.</p><h3>The ground-receiver path</h3><div class="path"><span>Yagi + LNA</span><i></i><span>SDR</span><i></i><span>Doppler correction</span><i></i><span>QPSK</span><i></i><span>Decoding</span></div><p>The SDR supplies digital I/Q samples. Receiver software compensates for frequency shift before and during demodulation, followed by error-correction decoding.</p><p class="modal-note">Conceptual summary from the project discussion. Specific contributions, implementation details, and measured results still need to be added from the original materials.</p>`},tracker:{title:'Internship tracker',tags:['Software','Personal tools'],description:'A practical tool for organizing applications and keeping track of where things stand.',detail:`<h2>Internship tracker</h2><p>A personal software project for organizing internship applications and tracking their statuses.</p><h3>A practical workflow</h3><div class="path"><span>Explore</span><i></i><span>Applied</span><i></i><span>In conversation</span><i></i><span>Decision</span></div><p>This is an illustrative workflow. Private application data is not connected to this portfolio.</p><p class="modal-note">Implementation details, screenshots, and individual contributions still need to be added from the original project.</p>`}};
const about=`<div class="eyebrow">Beyond the architecture</div><h2>Outside the<br><span>architecture.</span></h2><p class="description">I’m part of the <strong>CMU community.</strong> I like messing with sensors and motors, and seeing what happens when code meets the physical world.</p><div class="interest-toggles" aria-label="Personal interests"><button class="active" data-interest="tinker">Tinkering</button><button data-interest="sports">Tennis & football</button><button data-interest="dog">My dog</button></div><p class="interest-note" id="interest-note">Sensors, motors, and making something move.</p>`;
const connect=`<div class="eyebrow">Input / Output</div><h2>Good systems<br><span>start with<br>a connection.</span></h2><p class="description">For opportunities, project conversations, and a shared curiosity about how things work.</p><div class="contact-rows"><div class="contact-row">Résumé<span>PDF COMING NEXT</span></div><div class="contact-row">Email & profiles<span>NOT YET ADDED</span></div></div><p class="contact-notice">The visual concept is ready to explore. Résumé, professional links, and full experience details are still needed before sharing with recruiters.</p>`;
function work(){const p=projects[project];return `<div class="eyebrow">Selected work / Execution</div><div class="project-picker"><button data-project="skimmer" class="${project==='skimmer'?'active':''}">Skimmer</button><button data-project="tracker" class="${project==='tracker'?'active':''}">Internship tracker</button></div><h2 class="project-title">${p.title}</h2><div class="tagline">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><p class="description">${p.description}</p><button class="primary" id="read-project"><span class="square" aria-hidden="true"></span>Read project notes</button><p class="small-note">A focused look at one project at a time.</p>`}
function show(view,update=true){active=views.includes(view)?view:'overview';panel.innerHTML=active==='overview'?intro:active==='work'?work():active==='about'?about:connect;panel.classList.remove('enter');void panel.offsetWidth;panel.classList.add('enter');panel.setAttribute('aria-labelledby','tab-'+active);document.querySelectorAll('[role="tab"]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.go===active));b.tabIndex=b.dataset.go===active?0:-1});document.querySelectorAll('.section-indicator button').forEach(b=>b.classList.toggle('active',b.dataset.go===active));document.querySelectorAll('.unit').forEach(g=>{g.classList.toggle('active',g.dataset.view===active);g.setAttribute('aria-pressed',String(g.dataset.view===active))});document.querySelector('#active-component').textContent={overview:'CONTROL PLANE',work:'EXECUTION CLUSTER',about:'CACHE / PERSONAL STATE',connect:'I/O INTERCONNECT'}[active];document.querySelector('#next').textContent='Next: '+{overview:'Overview',work:'Work',about:'About',connect:'Connect'}[views[(views.indexOf(active)+1)%4]];if(update)history.replaceState(null,'','#'+active)}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){e.preventDefault();show(go.dataset.go);return}const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;show('work');return}const interest=e.target.closest('[data-interest]');if(interest){document.querySelectorAll('[data-interest]').forEach(b=>b.classList.toggle('active',b===interest));document.querySelector('#interest-note').textContent={tinker:'Sensors, motors, and making something move.',sports:'I like watching tennis and football.',dog:'There’s a dog in my life, too. A good reason to step away from the screen.'}[interest.dataset.interest]}if(e.target.closest('#read-project')){document.querySelector('#project-content').innerHTML=projects[project].detail;document.querySelector('#project-dialog').showModal()}});document.querySelectorAll('.unit').forEach(g=>{g.addEventListener('click',()=>show(g.dataset.view));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(g.dataset.view)}})});document.querySelector('#next').onclick=()=>show(views[(views.indexOf(active)+1)%4]);document.querySelector('#close-dialog').onclick=()=>document.querySelector('#project-dialog').close();document.querySelector('#project-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.querySelector('#pause').onclick=e=>{const paused=document.querySelector('#visual').classList.toggle('paused');e.currentTarget.textContent=paused?'Resume signals':'Pause signals';e.currentTarget.setAttribute('aria-pressed',String(paused))};document.querySelector('.nav').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const i=views.indexOf(active);const n=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;show(views[n]);document.querySelector('#tab-'+views[n]).focus()}});window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));show(location.hash.slice(1)||'overview');
</script></body></html>
