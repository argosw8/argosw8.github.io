const data={"about": "<h2>ABOUT</h2><p>I\u2019m part of the <strong>Carnegie Mellon community.</strong> I\u2019m interested in computer architecture and how the hardware beneath our software works.</p><p>I also like messing with sensors and motors, watching tennis and football, and life with a dog.</p><div class=\"tagline\"><span>Computer architecture</span><span>\u00b7</span><span>Hardware + software</span><span>\u00b7</span><span>Hands-on tinkering</span></div>", "experience": "<h2>EXPERIENCE</h2><div class=\"rows\"><article class=\"row\"><h3>Hardware & dataflow</h3><p>Skimmer, FPGA compute, and the path a signal takes through a system.</p></article><article class=\"row\"><h3>Practical software</h3><p>A personal internship tracker for organizing applications and statuses.</p></article><article class=\"row\"><h3>Physical systems</h3><p>Hands-on curiosity about sensors, motors, and making things respond to code.</p></article></div><p class=\"note\">Role details, organizations, dates, and achievements pending the actual r\u00e9sum\u00e9.</p>", "projects": "<h2>PROJECTS</h2><div class=\"rows\"><article class=\"row\"><button class=\"command-link\" data-command=\"skimmer\">Skimmer</button><div class=\"label\">FPGA / DATAFLOW / SIGNALS</div><p>Exploring FPGA compute and dataflow, alongside the signal-processing chain of a ground receiver.</p></article><article class=\"row\"><button class=\"command-link\" data-command=\"tracker\">Internship tracker</button><div class=\"label\">SOFTWARE / PERSONAL TOOLS</div><p>A practical tool for organizing internship applications and keeping track of their statuses.</p></article></div><p class=\"note\">Select a project or type skimmer / tracker for notes.</p>", "research": "<h2>RESEARCH</h2><h3>Research interests</h3><p>Computer architecture connects my interests in hardware, software, and dataflow.</p><ul><li>How does an architecture shape the way data moves?</li><li>Where should work happen\u2014in hardware, software, or both?</li><li>How do simple building blocks become a useful system?</li></ul>", "education": "<h2>EDUCATION</h2><h3>Carnegie Mellon University</h3><p>Part of the CMU community, with an interest in computer architecture and the connection between hardware and software.</p><div class=\"tagline\"><span>Computer architecture</span><span>\u00b7</span><span>FPGA & dataflow</span><span>\u00b7</span><span>Sensors & motors</span></div><p class=\"note\">Degree, dates, and coursework pending the actual r\u00e9sum\u00e9.</p>", "skimmer": "<h2>SKIMMER</h2><div class=\"label\">FPGA / DATAFLOW / SIGNALS</div><p>Exploring FPGA compute and dataflow, alongside a ground-receiver signal-processing chain.</p><h3>Conceptual receiver path</h3><p>Yagi + LNA \u2192 SDR \u2192 Doppler correction \u2192 QPSK demodulation \u2192 Decoding</p><p>The SDR provides digital I/Q samples. Software compensates for frequency shift before and during demodulation.</p><p class=\"note\">Specific contributions, implementation details, and measured results still need the original project materials.</p>", "tracker": "<h2>INTERNSHIP TRACKER</h2><div class=\"label\">SOFTWARE / PERSONAL TOOLS</div><p>A practical tool for organizing internship applications and tracking their statuses.</p><h3>Illustrative workflow</h3><p>Explore \u2192 Applied \u2192 In conversation \u2192 Decision</p><p class=\"note\">Private application data is not connected. Implementation details, screenshots, and specific contributions still need to be added from the original project.</p>", "resume": "<h2>R\u00c9SUM\u00c9</h2><p>R\u00e9sum\u00e9 PDF not attached.</p><p>Preferred email, GitHub, and LinkedIn links pending.</p><p class=\"note\">Verified experience, dates, and project results will be added from the original records.</p>", "help": "<h2>COMMANDS</h2><div class=\"command-table\"><strong>about</strong><span>Background and interests</span><strong>experience</strong><span>Current work and activities</span><strong>projects</strong><span>Selected projects</span><strong>research</strong><span>Research interests</span><strong>education</strong><span>Carnegie Mellon</span><strong>skimmer</strong><span>Skimmer project notes</span><strong>tracker</strong><span>Internship tracker notes</span><strong>resume</strong><span>R\u00e9sum\u00e9 and contact status</span><strong>ls</strong><span>List sections</span><strong>clear</strong><span>Clear the transcript</span><strong>history</strong><span>Command history</span><strong>help</strong><span>Show commands</span></div><p class=\"note\">Aliases: open projects \u00b7 cat about \u00b7 cd education</p>"};const names=['About','Experience','Projects','Research','Education'],ids=['about','experience','projects','research','education'],positions=[[0,0],[1450,-720],[2900,0],[4350,720],[5800,0]],world=document.querySelector('#world');let active=0,camera={x:0,y:0,scale:1},animation=0,lockUntil=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');

function stripHeading(html){return html.replace(/^<h2>[\s\S]*?<\/h2>/,'')}
function stationContent(i){if(i===0)return `<div class="station-grid"><div class="copy"><div class="eyebrow">Carnegie Mellon / Computer architecture</div><h1>Arav<br><span>Goswami.</span></h1><p>I’m interested in computer architecture and the hardware beneath our software.</p><p class="personal-list">Sensors & motors. Tennis & football.<br>Life with a dog.</p><div class="next-prompt"><button class="action" data-go="2">Selected projects</button><button class="text-action" data-go="1">Experience</button></div></div>${architectureArt}</div>`;
if(i===1)return `<div class="station-grid"><div class="copy"><div class="section-marker"></div><div class="eyebrow">Experience</div><h2>Putting ideas<br><span>into practice.</span></h2><p class="experience-note">Role details, organizations, dates, and achievements are still pending the actual résumé.</p><button class="text-action" data-resume>Résumé & professional details</button></div><div class="copy experience-visual body-content">${stripHeading(data.experience).replace(/<p class="note">[\s\S]*?<\/p>/,'')}</div></div>`;

if(i===3)return `<div class="station-grid"><div class="copy"><div class="section-marker"></div><div class="eyebrow">Research interests</div><h2>Follow<br><span>the questions.</span></h2><p>Computer architecture connects my interests in hardware, software, and dataflow.</p></div><div class="copy question-lines"><p>How does an architecture shape the way data moves?</p><p>Where should work happen—in hardware, software, or both?</p><p>How do simple building blocks become a useful system?</p></div></div>`;
return `<div class="station-grid"><div class="copy"><div class="section-marker"></div><div class="eyebrow">Education</div><h2>Carnegie<br><span>Mellon.</span></h2><div class="flat-content">${stripHeading(data.education).replace('<h3>Carnegie Mellon University</h3>','')}</div><button class="text-action" data-resume>Résumé & professional details</button></div><div class="art"><svg class="education-etch" viewBox="0 0 570 460" aria-hidden="true"><g class="wire"><path d="M80 150H180V80H390V150H490V310H390V380H180V310H80Z"/><path d="M95 164H195V95H375V164H475V295H375V365H195V295H95Z"/></g><path class="wire-lit" d="M80 150H180V80H390V150H490V310H390V380H180V310H80Z"/></svg><div class="education-mark">CMU<span>CARNEGIE MELLON UNIVERSITY</span></div></div></div>`}
const palette=['#b8d2e8','#e1b891','#9ed5cb','#c4b4e6','#d7aab6'];const stations=[];positions.forEach(([x,y],i)=>{const s=document.createElement('section');s.className='station';s.id=ids[i];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--scene-accent',palette[i]);s.setAttribute('aria-label',names[i]);s.innerHTML=stationContent(i);world.append(s);stations.push(s);const b=document.createElement('button');b.dataset.go=i;b.style.setProperty('--scene-accent',palette[i]);b.textContent=names[i];document.querySelector('#progress-nav').append(b)});
function targetScale(){return innerWidth<=650?1:Math.min(1.06,(innerWidth-130)/1120,(innerHeight-155)/580)}function draw(){world.style.transform=`translate(${innerWidth/2}px,${innerHeight/2}px) scale(${camera.scale}) rotate(${camera.roll||0}deg) translate(${-camera.x}px,${-camera.y}px)`}
function travel(i,instant=false){i=Math.max(0,Math.min(4,i));active=i;document.querySelector('#app').style.setProperty('--scene-accent',palette[i]);document.querySelector('#app').style.setProperty('--ambient',palette[i]);stations.forEach((s,j)=>{s.classList.toggle('active',j===i);s.inert=j!==i});document.querySelectorAll('#progress-nav button').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-current',j===i?'page':'false')});document.querySelector('#position-label').innerHTML=names[i]+` <span class="current-count">${i+1} / 5</span>`;document.querySelector('#previous').disabled=i===0;document.querySelector('#next').disabled=i===4;history.replaceState(null,'','#'+ids[i]);cancelAnimationFrame(animation);const from={...camera},to={x:positions[i][0],y:positions[i][1],scale:targetScale(),roll:0},start=performance.now(),duration=instant||reduced.matches?0:1450;lockUntil=Date.now()+duration+150;document.querySelector('#app').classList.add('moving');function tick(now){const t=duration?Math.min(1,(now-start)/duration):1,e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;camera.x=from.x+(to.x-from.x)*e;camera.y=from.y+(to.y-from.y)*e-Math.sin(Math.PI*t)*145;camera.scale=from.scale+(to.scale-from.scale)*e-Math.sin(Math.PI*t)*Math.min(.24,to.scale*.24);camera.roll=Math.sin(Math.PI*t)*((to.x-from.x)<0?-1.2:1.2);draw();if(t<1)animation=requestAnimationFrame(tick);else{camera={...to};draw();document.querySelector('#app').classList.remove('moving')}}animation=requestAnimationFrame(tick)}
function openDialog(content,label){document.querySelector('#dialog-content').innerHTML=content;document.querySelector('#dialog-title').textContent=label;document.querySelector('#dialog').showModal()}document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){travel(Number(go.dataset.go));return}const p=e.target.closest('[data-command]');if(p){openDialog(data[p.dataset.command],p.dataset.command==='skimmer'?'SKIMMER':'INTERNSHIP TRACKER');return}if(e.target.closest('[data-resume]'))openDialog(data.resume,'RÉSUMÉ & PROFESSIONAL LINKS')});document.querySelector('#resume').onclick=()=>openDialog(data.resume,'RÉSUMÉ & PROFESSIONAL LINKS');document.querySelector('#close').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.querySelector('#previous').onclick=()=>travel(active-1);document.querySelector('#next').onclick=()=>travel(active+1);
document.addEventListener('keydown',e=>{if(document.querySelector('#dialog').open)return;if(['ArrowRight','ArrowDown','PageDown','ArrowLeft','ArrowUp','PageUp','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')travel(0);else if(e.key==='End')travel(4);else if(['ArrowRight','ArrowDown','PageDown'].includes(e.key))travel(active+1);else travel(active-1)}});document.querySelector('#app').addEventListener('wheel',e=>{if(document.querySelector('#dialog').open||Date.now()<lockUntil||Math.abs(e.deltaY)<30)return;let copy=e.target.closest('.copy');if(!copy||copy.scrollHeight<=copy.clientHeight+4)copy=e.target.closest('.station');if(copy&&copy.scrollHeight>copy.clientHeight+4){const bottom=copy.scrollTop+copy.clientHeight>=copy.scrollHeight-4,top=copy.scrollTop<=3;if(e.deltaY>0&&!bottom||e.deltaY<0&&!top)return}const next=active+(e.deltaY>0?1:-1);if(next>=0&&next<5)travel(next)},{passive:true});let touchY=null;document.querySelector('#app').addEventListener('touchstart',e=>{if(e.target.closest('dialog')||e.target.closest('.copy'))return;touchY=e.touches[0].clientY},{passive:true});document.querySelector('#app').addEventListener('touchend',e=>{if(touchY===null)return;const dy=touchY-e.changedTouches[0].clientY;touchY=null;if(Math.abs(dy)>55)travel(active+(dy>0?1:-1))},{passive:true});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>travel(active,true),100)});addEventListener('hashchange',()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0&&i!==active)travel(i)});const route=ids.indexOf(location.hash.slice(1));travel(route>=0?route:0,true);
