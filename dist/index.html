<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arav Goswami — Portfolio</title><meta name="description" content="Arav Goswami’s personal portfolio: projects, technical interests, and CMU."><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#e6edea;--dim:#8daba4;--line:#ffffff16;--accent:#d5f78a}*{box-sizing:border-box}body{margin:0;background:#102c29;color:var(--ink);font:14px 'DM Sans',sans-serif;height:100dvh;overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{height:43px;background:#10221ee0;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 23px;gap:25px;font-size:12px}header strong{font-family:'Space Grotesk';font-size:15px}header .right{margin-left:auto;display:flex;gap:22px;color:#bdcdc5}.dot{display:inline-block;background:var(--accent);width:6px;height:6px;border-radius:50%;margin-right:7px}.desktop{position:absolute;inset:43px 0 0;background:radial-gradient(ellipse at 70% 70%,#30706670,transparent 65%),repeating-linear-gradient(0deg,transparent,transparent 47px,#ffffff04 48px),repeating-linear-gradient(90deg,transparent,transparent 47px,#ffffff04 48px)}.wallpaper{position:absolute;left:5%;bottom:18%;pointer-events:none}.wallpaper h1{font:500 clamp(70px,10vw,155px)/.9 'Space Grotesk';letter-spacing:-9px;color:#bcd7bf15;margin:0}.wallpaper p{color:#a3c1ad40;letter-spacing:5px;font:10px monospace}.icons{position:absolute;top:32px;left:25px;display:grid;gap:22px}.app-icon{background:none;border:0;width:87px;display:grid;justify-items:center;gap:8px;font-size:11px}.glyph{width:49px;height:49px;background:#24443b;border:1px solid #b9d9c438;border-radius:13px;display:grid;place-items:center;box-shadow:0 6px 15px #0002;font:25px 'Space Grotesk';color:#d5f78a}.app-icon:hover .glyph{background:#385b48;transform:translateY(-2px)}.window{position:absolute;top:7%;left:19%;width:min(830px,73vw);height:min(590px,74vh);border:1px solid #ffffff25;border-radius:13px;background:#132522;box-shadow:0 30px 100px #00151280;overflow:hidden;display:flex;flex-direction:column}.titlebar{height:45px;min-height:45px;background:#20332e;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;gap:8px}.traffic{width:11px;height:11px;padding:0;border:0;border-radius:50%;background:#ee887b}.traffic.min{background:#e4c47b}.traffic.max{background:#a2c89c}.window-title{position:absolute;left:50%;transform:translateX(-50%);color:#b5c6bf;font-size:11px;pointer-events:none}.window-body{overflow:auto;flex:1;scrollbar-color:#415b4a transparent}.welcome{display:grid;grid-template-columns:1.1fr 1fr;min-height:100%}.intro{padding:37px 33px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.eyebrow{font:10px monospace;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.intro h2{font:500 52px/.99 'Space Grotesk';letter-spacing:-2px;margin:22px 0}.muted{color:#a4b7ae;line-height:1.8}.intro p{font-size:13px}.pill{display:inline-flex;align-items:center;width:fit-content;border:1px solid #ffffff20;padding:7px 10px;border-radius:20px;font:10px monospace;color:#bdd0c4}.primary{border:0;background:var(--accent);color:#26371c;padding:12px 16px;border-radius:6px;font-weight:600;display:flex;justify-content:space-between;margin-top:24px}.intro footer{margin-top:auto;padding-top:30px;color:#667f72;font:10px monospace}.featured{padding:34px 26px;background:#172b25}.featured h3{font:500 20px 'Space Grotesk';margin:18px 0 6px}.featured p{font-size:12px;color:#9db0a5;line-height:1.7}.project-visual{height:177px;border:1px solid #ffffff12;border-radius:6px;margin-top:23px;position:relative;background:radial-gradient(circle at center,#7a9f4130,transparent 70%),repeating-linear-gradient(0deg,transparent,transparent 19px,#ffffff05 20px),repeating-linear-gradient(90deg,transparent,transparent 19px,#ffffff05 20px);display:flex;align-items:center;justify-content:center;gap:9px}.chip{border:1px solid #d5f78a80;padding:16px 12px;color:var(--accent);font:11px monospace;box-shadow:0 0 30px #d5f78a12}.signal{color:#9db77c;font:18px monospace}.small-label{position:absolute;bottom:12px;left:12px;font:8px monospace;color:#7e9b83;letter-spacing:1px}.text-link{border:0;background:none;color:var(--accent);padding:12px 0;font-size:11px}.quick{border-top:1px solid var(--line);margin-top:15px;padding-top:15px;display:flex;gap:15px;color:#a6baab;font:10px monospace}.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px;background:#19332be8;border:1px solid #ffffff20;border-radius:18px;backdrop-filter:blur(20px);box-shadow:0 10px 40px #001b1880}.dock button{position:relative;background:#2d493d;border:1px solid #ffffff10;border-radius:11px;width:47px;height:47px;font:23px 'Space Grotesk';color:#d4edbb;transition:transform .15s}.dock button:hover{transform:translateY(-7px);background:#456149}.dock button:hover:before{content:attr(aria-label);position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#10231f;padding:6px 9px;border-radius:5px;white-space:nowrap;font:11px 'DM Sans'}.corner{position:absolute;bottom:25px;right:25px;color:#8eab9b;font:9px monospace;line-height:1.9;text-align:right}.content{padding:30px}.content h2{font:500 33px 'Space Grotesk';letter-spacing:-1px;margin:12px 0 10px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px}.card{background:#20352d;border:1px solid var(--line);padding:24px;border-radius:8px;text-align:left}.card h3{font:500 22px 'Space Grotesk';margin:16px 0 10px}.card p{font-size:12px;line-height:1.8;color:#a6b9ae}.tag{font:9px monospace;color:#d5f78a}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:30px 0}.flow button{background:#264034;border:1px solid #8eac6150;border-radius:5px;padding:18px 12px;font:11px monospace}.flow button.selected{background:var(--accent);color:#203223}.detail{padding:22px;background:#1d342a;border-left:2px solid var(--accent);line-height:1.8;color:#bdcbbf}.notice{font-size:11px;color:#849b8c;line-height:1.7}.terminal{padding:25px;background:#0b1915;min-height:100%;font:13px/1.9 monospace;color:#bdd7ad}.terminal p{margin:0 0 10px}.prompt{color:var(--accent)}.terminal form{display:flex;gap:9px}.terminal input{border:0;outline:none;background:transparent;color:#e8efd9;min-width:0;flex:1;font:inherit}.note{padding:20px 0;border-bottom:1px solid var(--line)}.note h3{font-weight:500}.note p{color:#a3b5a8;line-height:1.8}.hidden{display:none}.maximized{inset:10px 14px 90px!important;width:auto!important;height:auto!important}.help{position:absolute;right:27px;top:28px;font:10px monospace;color:#8da799}.help span{color:var(--accent)}@media(max-width:700px){header{padding:0 14px}header .right span:first-child{display:none}.icons{display:none}.window{left:12px!important;top:22px!important;width:calc(100% - 24px);height:calc(100% - 118px)}.welcome{grid-template-columns:1fr}.intro{padding:27px;border-right:0}.intro h2{font-size:45px}.featured{padding:25px}.intro footer{padding-top:20px}.corner,.help{display:none}.cards{grid-template-columns:1fr}.dock{gap:6px;padding:8px;bottom:13px}.dock button{width:43px;height:43px}.content{padding:24px}.wallpaper h1{letter-spacing:-5px}}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}.hero-actions .primary{margin:0;gap:24px}.secondary{border:1px solid #ffffff30;background:transparent;padding:11px 13px;border-radius:6px;font-size:12px}.secondary:hover{background:#ffffff0d}.personal-peek{text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);margin-top:20px;padding:17px 0 0;color:#c8d5bd;line-height:2;font-size:12px}.personal-peek span{font:9px monospace;color:#849d87;letter-spacing:1px}.about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:30px}.about-item p{color:#a4b7ae;font-size:12px;line-height:1.9}.about-item h3{font:500 18px 'Space Grotesk'}.about-symbol{font:24px 'Space Grotesk';color:var(--accent)}.about-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:30px;padding-top:10px}.draft-box{background:#21362c;border:1px dashed #809c6850;padding:20px;border-radius:7px;margin:24px 0}.draft-box p{color:#a4b7ae;line-height:1.8;font-size:12px;margin-bottom:0}.resume-row{display:grid;grid-template-columns:120px 1fr;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.resume-row p{line-height:1.7}.intro h2{font-size:48px}@media(max-width:700px){.about-grid{grid-template-columns:1fr;gap:13px}.about-bottom{align-items:start;flex-direction:column}.intro h2{font-size:45px}.resume-row{grid-template-columns:95px 1fr}.hero-actions{gap:7px}}</style></head><body><header><strong>◈ &nbsp;arav<span style="color:#8aab94">OS</span></strong><span style="color:#94aa9c">Arav Goswami / Portfolio</span><div class="right"><span><i class="dot"></i>CMU · Hardware & software</span><time id="clock"></time></div></header><main class="desktop"><div class="wallpaper"><h1>aravOS</h1><p>ARAV GOSWAMI / PERSONAL PORTFOLIO</p></div><div class="icons" id="icons"></div><div class="help"><span>01</span> / PERSONAL PORTFOLIO<br><br>Projects, background, and a little personality.</div><section class="window" id="window" aria-label="Application window"><div class="titlebar" id="titlebar"><button class="traffic" id="close" aria-label="Close window"></button><button class="traffic min" id="min" aria-label="Minimize window"></button><button class="traffic max" id="max" aria-label="Maximize window"></button><span class="window-title" id="title"></span></div><div class="window-body" id="body"></div></section><nav class="dock" id="dock" aria-label="Applications"></nav><div class="corner">ARAV GOSWAMI<br>PERSONAL PORTFOLIO / v0.2<br><span style="color:#c3d4aa">●</span> CARNEGIE MELLON UNIVERSITY</div></main><script>
const apps=[['welcome','◈','Welcome'],['projects','▱','Projects'],['resume','≡','Résumé'],['contact','↗','Contact'],['about','a','About'],['terminal','›_','Terminal']];
const body=document.querySelector('#body'),win=document.querySelector('#window');
for(const [id,glyph,label] of apps){const b=document.createElement('button');b.className='app-icon';b.innerHTML=`<span class="glyph">${glyph}</span>${label}`;b.onclick=()=>openApp(id);document.querySelector('#icons').append(b);const d=document.createElement('button');d.textContent=glyph;d.setAttribute('aria-label',label);d.onclick=()=>openApp(id);document.querySelector('#dock').append(d)}
const pages={welcome:()=>`<div class="welcome"><div class="intro"><span class="eyebrow">A little about the operator</span><h2>Hi, I’m Arav.<br>Welcome to<br>my workspace.</h2><p class="muted">Exploring the connections between hardware, signals, and software. This is a place to look inside the things I’m working on.</p><span class="pill"><i class="dot"></i> Always a work in progress</span><button class="primary" data-app="projects">Explore my projects <span>↗</span></button><footer>TIP: the icons work. So does the terminal.</footer></div><div class="featured"><span class="eyebrow" style="color:#8fa88f">On the workbench / 001</span><div class="project-visual"><span class="chip">FPGA</span><span class="signal">→</span><span class="chip">RF</span><span class="signal">→</span><span class="chip">RX</span><span class="small-label">SKIMMER / SYSTEM EXPLORER</span></div><h3>Following the signal.</h3><p>A closer look at Skimmer: from FPGA compute and dataflow to receiving and decoding on the ground.</p><button class="text-link" data-app="skimmer">Open system explorer &nbsp; ↗</button><div class="quick"><span>01 HARDWARE</span><span>02 SIGNALS</span><span>03 SOFTWARE</span></div><p class="notice">Interactive portfolio concept.<br>Project summaries are provisional.</p></div></div>`,projects:()=>`<div class="content"><span class="eyebrow">~/projects</span><h2>Things on the workbench.</h2><p class="muted">A starting point for the projects behind the résumé.</p><div class="cards"><button class="card" data-app="skimmer"><span class="tag">HARDWARE / SIGNAL PROCESSING</span><h3>Skimmer ↗</h3><p>Explore a conceptual signal path and the relationship between onboard processing and the ground receiver.</p><span class="pill">Open system explorer</span></button><button class="card" data-app="tracker"><span class="tag">SOFTWARE / PERSONAL TOOLS</span><h3>Internship tracker ↗</h3><p>A tool for keeping applications and statuses in one place. Open an illustrative version of the project view.</p><span class="pill">View project sketch</span></button></div><p class="notice">Demo content based on available conversation context. Detailed contributions and results will come from your actual project materials.</p></div>`,skimmer:()=>`<div class="content"><span class="eyebrow">SKIMMER / SYSTEM EXPLORER</span><h2>From orbit to information.</h2><p class="muted">Select a stage to look inside the ground receiver.</p><div class="flow">${['Yagi + LNA','SDR','Doppler correction','QPSK','Decoding'].map((x,i)=>`<button data-stage="${i}" class="${i===0?'selected':''}">${x}</button>${i<4?'<span style="color:#7d9c7c">→</span>':''}`).join('')}</div><div class="detail" id="stage-detail">The antenna receives the radio signal. The low-noise amplifier raises its level before it reaches the SDR.</div><div class="project-visual" style="height:130px"><svg viewBox="0 0 600 100" width="100%" height="100%" aria-label="Illustrative received signal waveform"><path d="M0 50 Q10 0 20 50 T40 50 T60 50 T80 50 T100 50 T120 50 T140 50 T160 50 T180 50 T200 50 T220 50 T240 50 T260 50 T280 50 T300 50 T320 50 T340 50 T360 50 T380 50 T400 50 T420 50 T440 50 T460 50 T480 50 T500 50 T520 50 T540 50 T560 50 T580 50 T600 50" fill="none" stroke="#d5f78a" stroke-width="1.5"/></svg><span class="small-label">ILLUSTRATIVE WAVEFORM · NOT LIVE TELEMETRY</span></div><p class="notice">Conceptual receiver sequence recovered from our project discussion. This demo does not represent the complete Skimmer architecture.</p></div>`,tracker:()=>`<div class="content"><span class="eyebrow">PROJECT SKETCH / SOFTWARE</span><h2>Internship tracker.</h2><p class="muted">A practical home for applications, follow-ups, and progress.</p><div class="cards">${['To explore','Applied','In conversation','Decision'].map((x,i)=>`<div class="card"><span class="tag">0${i+1}</span><h3>${x}</h3><p>A place for applications at this stage.</p></div>`).join('')}</div><p class="notice">Illustrative portfolio preview. Your real tracker and application data are not connected.</p></div>`,terminal:()=>`<div class="terminal"><p>aravOS [version 0.1]<br>Welcome to the inside of the workspace.</p><p>Type <span class="prompt">help</span> for commands.</p><div id="output"></div><form id="command"><label class="prompt" for="input">arav@workspace ~ %</label><input id="input" autocomplete="off" spellcheck="false" aria-label="Terminal command"></form></div>`,notes:()=>`<div class="content"><span class="eyebrow">~/notes</span><h2>Working notes.</h2><p class="muted">A few ideas for the notebook section.</p><article class="note"><span class="tag">SIGNAL PROCESSING</span><h3>Where does Doppler correction happen?</h3><p>In the receiver sequence we discussed, the SDR supplies digital I/Q samples. Software corrects the frequency shift before and during demodulation.</p></article><article class="note"><span class="tag">SYSTEM DESIGN</span><h3>Follow the data.</h3><p>A project write-up could trace where data enters, how it moves through compute stages, and which constraints shape the architecture.</p></article><p class="notice">Prototype notes, not published articles.</p></div>`,about:()=>`<div class="content"><span class="eyebrow">ABOUT THE OPERATOR</span><h2>Arav Goswami.</h2><p class="muted">Hardware. Signals. Software.<br>A personal workspace for projects, technical questions, and things in progress.</p><div class="detail">This prototype explores how an operating-system interface could tell the story of your work. The final version would add your verified biography, résumé, project contributions, and contact links.</div><h3 style="margin-top:30px">Make yourself at home.</h3><p class="muted">Open apps from the dock. Drag the title bar. Use the colored controls to close, minimize, or maximize a window. Try <code>help</code> in the terminal.</p><button class="primary" data-app="projects">Explore the work ↗</button></div>`};
function openApp(id){if(!pages[id])id='welcome';win.classList.remove('hidden');document.querySelector('#title').textContent=(apps.find(x=>x[0]===id)?.[2]||(id==='skimmer'?'Skimmer':'Internship tracker'))+' — aravOS';body.innerHTML=pages[id]();body.scrollTop=0;history.replaceState(null,'','#'+id);if(id==='terminal'){document.querySelector('#command').onsubmit=command;document.querySelector('#input').focus()}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-app]');if(a)openApp(a.dataset.app);const s=e.target.closest('[data-stage]');if(s){document.querySelectorAll('[data-stage]').forEach(x=>x.classList.remove('selected'));s.classList.add('selected');document.querySelector('#stage-detail').textContent=['The antenna receives the radio signal. The low-noise amplifier raises its level before it reaches the SDR.','The SDR converts the received radio signal into digital I/Q samples for software processing.','Receiver software compensates for the carrier-frequency shift caused by relative motion. Fine tracking continues during demodulation.','QPSK demodulation estimates the transmitted symbols from the corrected samples.','Error-correction decoding helps recover the transmitted information from the received symbols.'][Number(s.dataset.stage)]}});
function command(e){e.preventDefault();const input=document.querySelector('#input'),v=input.value.trim().toLowerCase();const out=document.querySelector('#output');const line=document.createElement('p');line.textContent='arav@workspace ~ % '+input.value;out.append(line);input.value='';const mapping={projects:'projects',skimmer:'skimmer',about:'about',resume:'resume',contact:'contact',notes:'notes',home:'welcome'};if(mapping[v]){openApp(mapping[v]);return}if(v==='clear'){out.replaceChildren();return}const reply=document.createElement('p');reply.textContent=v==='help'?'Commands: about · projects · resume · contact · skimmer · home · date · whoami · clear · help':v==='whoami'?'A curious visitor inside Arav’s workspace.':v==='date'?new Date().toLocaleString():v?'Command not found. Try help.':'';out.append(reply);body.scrollTop=body.scrollHeight}
document.querySelector('#close').onclick=document.querySelector('#min').onclick=()=>win.classList.add('hidden');document.querySelector('#max').onclick=()=>win.classList.toggle('maximized');let drag;document.querySelector('#titlebar').addEventListener('pointerdown',e=>{if(e.target.closest('button')||innerWidth<701||win.classList.contains('maximized'))return;drag={x:e.clientX,y:e.clientY,left:win.offsetLeft,top:win.offsetTop};e.currentTarget.setPointerCapture(e.pointerId)});document.querySelector('#titlebar').addEventListener('pointermove',e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-150,drag.left+e.clientX-drag.x))+'px';win.style.top=Math.max(0,Math.min(innerHeight-140,drag.top+e.clientY-drag.y))+'px'});document.querySelector('#titlebar').addEventListener('pointerup',()=>drag=null);document.querySelector('#titlebar').addEventListener('pointercancel',()=>drag=null);function clock(){document.querySelector('#clock').textContent=new Date().toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,30000);
pages.welcome=()=>`<div class="welcome"><div class="intro"><span class="eyebrow">ARAV GOSWAMI / CARNEGIE MELLON</span><h2>Curious about<br>how things<br>work.</h2><p class="muted">I’m Arav, part of the CMU community. I like working at the intersection of hardware and software—and getting hands-on with sensors and motors.</p><div class="hero-actions"><button class="primary" data-app="projects">View projects <span>↗</span></button><button class="secondary" data-app="resume">Résumé</button><button class="secondary" data-app="contact">Contact ↗</button></div><footer>A quick introduction. A few things I’ve built.<br>And a desktop you can explore.</footer></div><div class="featured"><span class="eyebrow" style="color:#8fa88f">SELECTED WORK / 01</span><div class="project-visual"><span class="chip">FPGA</span><span class="signal">→</span><span class="chip">RF</span><span class="signal">→</span><span class="chip">RX</span><span class="small-label">SKIMMER / HARDWARE + SIGNALS</span></div><h3>Skimmer</h3><p>FPGA compute, dataflow, and a ground-receiver signal path. Explore the system through an interactive technical overview.</p><button class="text-link" data-app="skimmer">Explore project &nbsp; ↗</button><div class="quick"><span>HARDWARE</span><span>SIGNAL PROCESSING</span></div><button class="personal-peek" data-app="about"><span>BEYOND THE PROJECTS</span><br>Tennis, football, and a dog. &nbsp; ↗</button></div></div>`;
pages.projects=()=>`<div class="content"><span class="eyebrow">SELECTED PROJECTS</span><h2>Hardware meets software.</h2><p class="muted">A closer look at systems work and practical tools.</p><div class="cards"><button class="card" data-app="skimmer"><span class="tag">01 / HARDWARE · SIGNAL PROCESSING</span><h3>Skimmer ↗</h3><p>FPGA compute and dataflow, alongside a conceptual view of the ground-receiver processing chain.</p><span class="pill">Explore the signal path</span></button><button class="card" data-app="tracker"><span class="tag">02 / SOFTWARE · PERSONAL TOOLS</span><h3>Internship tracker ↗</h3><p>A project for organizing internship applications and keeping track of their statuses.</p><span class="pill">View project overview</span></button></div><div class="detail" style="margin-top:22px"><span class="tag">TECHNICAL INTERESTS</span><p>Sensors, motors, and the connection between physical systems and software.</p></div><p class="notice">Portfolio draft: individual contributions, implementation details, and results still need to be filled in from the project materials.</p></div>`;
pages.about=()=>`<div class="content"><span class="eyebrow">ABOUT ME</span><h2>Hi, I’m Arav.</h2><p class="muted" style="font-size:16px;max-width:580px">I’m part of the Carnegie Mellon community, and I like understanding how things work—especially when I can wire something up, read a sensor, or get a motor moving.</p><div class="about-grid"><article class="about-item"><span class="about-symbol">⌁</span><h3>On the workbench</h3><p>Messing with sensors and motors. Exploring the connections between hardware and software.</p></article><article class="about-item"><span class="about-symbol">↗</span><h3>Off the workbench</h3><p>I enjoy watching tennis and football. There’s also a dog in my life.</p></article><article class="about-item"><span class="about-symbol">CMU</span><h3>At Carnegie Mellon</h3><p>Part of the CMU community, with an interest in building things and exploring technical questions.</p></article></div><div class="about-bottom"><span class="muted">Want to see the technical side?</span><button class="text-link" data-app="projects">Explore my projects ↗</button></div></div>`;
pages.resume=()=>`<div class="content"><span class="eyebrow">RÉSUMÉ</span><h2>Background, at a glance.</h2><div class="resume-row"><span class="tag">NAME</span><p>Arav Goswami</p></div><div class="resume-row"><span class="tag">UNIVERSITY</span><p>Carnegie Mellon University</p></div><div class="resume-row"><span class="tag">INTERESTS</span><p>Hardware and software systems · Sensors and motors</p></div><div class="resume-row"><span class="tag">PROJECTS</span><p>Skimmer · Internship tracker</p></div><div class="draft-box"><strong>Résumé PDF coming next</strong><p>The original résumé isn’t attached to this draft. Education details, experience, skills, and a downloadable PDF will be added from the actual document.</p></div><button class="text-link" data-app="projects">View project overviews ↗</button></div>`;
pages.contact=()=>`<div class="content"><span class="eyebrow">CONTACT</span><h2>Let’s connect.</h2><p class="muted">For opportunities, project conversations, or a quick hello.</p><div class="draft-box"><strong>Contact links haven’t been added yet.</strong><p>This draft needs your preferred professional email, LinkedIn, and GitHub links before it’s ready to share with recruiters.</p></div><button class="text-link" data-app="about">A little more about me ↗</button></div>`;
openApp(location.hash.slice(1)||'welcome');
</script></body></html>
