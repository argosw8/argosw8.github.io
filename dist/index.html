function openDialog(content,label){document.querySelector('#dialog-content').innerHTML=content;document.querySelector('#dialog-title').textContent=label;document.querySelector('#dialog').showModal()}document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){travel(Number(go.dataset.go));return}const p=e.target.closest('[data-command]');if(p){openDialog(data[p.dataset.command],p.dataset.command==='skimmer'?'SKIMMER':'INTERNSHIP TRACKER');return}if(e.target.closest('[data-resume]'))openDialog(data.resume,'RÉSUMÉ & PROFESSIONAL LINKS')});document.querySelector('#resume').onclick=()=>openDialog(data.resume,'RÉSUMÉ & PROFESSIONAL LINKS');document.querySelector('#close').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.querySelector('#previous').onclick=()=>travel(active-1);document.querySelector('#next').onclick=()=>travel(active+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea')||document.querySelector('#dialog').open)return;if(['ArrowRight','ArrowDown','PageDown','ArrowLeft','ArrowUp','PageUp','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')travel(0);else if(e.key==='End')travel(4);else if(['ArrowRight','ArrowDown','PageDown'].includes(e.key))travel(active+1);else travel(active-1)}});document.querySelector('#app').addEventListener('wheel',e=>{if(document.querySelector('#dialog').open||Date.now()<lockUntil||Math.abs(e.deltaY)<30)return;let copy=e.target.closest('.copy');if(!copy||copy.scrollHeight<=copy.clientHeight+4)copy=e.target.closest('.station');if(copy&&copy.scrollHeight>copy.clientHeight+4){const bottom=copy.scrollTop+copy.clientHeight>=copy.scrollHeight-4,top=copy.scrollTop<=3;if(e.deltaY>0&&!bottom||e.deltaY<0&&!top)return}const next=active+(e.deltaY>0?1:-1);if(next>=0&&next<5)travel(next)},{passive:true});let touchY=null;document.querySelector('#app').addEventListener('touchstart',e=>{if(e.target.closest('dialog')||e.target.closest('.copy'))return;touchY=e.touches[0].clientY},{passive:true});document.querySelector('#app').addEventListener('touchend',e=>{if(touchY===null)return;const dy=touchY-e.changedTouches[0].clientY;touchY=null;if(Math.abs(dy)>55)travel(active+(dy>0?1:-1))},{passive:true});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{fit()},80)});addEventListener('hashchange',()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0&&i!==active)travel(i)});
const workspaceInput=document.querySelector('#workspace-input'),feedback=document.querySelector('#prompt-feedback');let workspaceHistory=[],workspaceHistoryIndex=0;
const workspaceHelp='<h2>Portfolio commands</h2><div class="workspace-command-list"><strong>about</strong><span>About Arav</span><strong>experience</strong><span>Current work and activities</span><strong>projects</strong><span>Selected projects</span><strong>research</strong><span>Research interests</span><strong>education</strong><span>Carnegie Mellon</span><strong>resume</strong><span>Résumé and contact details</span><strong>skimmer</strong><span>Skimmer project notes</span><strong>tracker</strong><span>Internship tracker notes</span><strong>help</strong><span>Available commands</span></div><p class="workspace-hint">Tab completes commands. Up / Down recalls history. Escape clears the prompt.</p>';
function workspaceCommand(raw){const text=raw.trim();if(!text)return;workspaceHistory.push(text);workspaceHistoryIndex=workspaceHistory.length;workspaceInput.value='';feedback.textContent='';let command=text.toLowerCase().replace(/^(open|cat|cd)\s+/,'').replace(/\/$/,'');const aliases={home:'about',intro:'about',work:'projects',cv:'resume','résumé':'resume',contact:'resume'};command=aliases[command]||command;const section=ids.indexOf(command);if(section>=0){travel(section);workspaceInput.focus({preventScroll:true});return}if(command==='resume'){openDialog(data.resume,'RÉSUMÉ & PROFESSIONAL LINKS');return}if(command==='skimmer'||command==='tracker'){openDialog(data[command],command==='skimmer'?'SKIMMER':'INTERNSHIP TRACKER');return}if(command==='help'||command==='ls'){openDialog(workspaceHelp,'PORTFOLIO COMMANDS');return}if(command==='clear'){feedback.textContent='';return}feedback.textContent='Unknown command: '+text+'. Type help for commands.';workspaceInput.focus({preventScroll:true})}
document.querySelector('#workspace-command').addEventListener('submit',e=>{e.preventDefault();workspaceCommand(workspaceInput.value)});document.querySelector('#workspace-help').onclick=()=>openDialog(workspaceHelp,'PORTFOLIO COMMANDS');workspaceInput.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();workspaceHistoryIndex=Math.max(0,workspaceHistoryIndex-1);workspaceInput.value=workspaceHistory[workspaceHistoryIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();workspaceHistoryIndex=Math.min(workspaceHistory.length,workspaceHistoryIndex+1);workspaceInput.value=workspaceHistory[workspaceHistoryIndex]||''}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.stopPropagation()}if(e.key==='Tab'){e.preventDefault();const value=workspaceInput.value.toLowerCase(),prefix=value.match(/^(open|cat|cd)\s+/)?.[0]||'',query=value.slice(prefix.length),options=[...ids,'resume','skimmer','tracker','help','clear'],matches=options.filter(x=>x.startsWith(query));if(matches.length===1){workspaceInput.value=prefix+matches[0];feedback.textContent=''}else if(query)feedback.textContent=matches.join(' · ')}if(e.key==='Escape'){e.preventDefault();workspaceInput.value='';feedback.textContent=''}});
const route=ids.indexOf(location.hash.slice(1));travel(route>=0?route:0,true);
