function datapath(){return `<div class="visual"><div class="visual-head"><span>A SMALL DATAPATH</span><span>ADD x3, x1, x2</span></div><svg class="datapath" viewBox="0 0 640 440" role="group" aria-label="Interactive datapath showing a register file, ALU, result, and write-back path"><defs><pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#4d709540"/></pattern></defs><rect width="640" height="440" fill="url(#grid)"/><path class="wire ${stage===0?'live':''}" d="M220 185H275V165H330"/><path class="wire ${stage===0?'live':''}" d="M220 310H275V325H330"/><path class="wire ${stage>=1?'live':''}" d="M490 245H555"/><path class="wire return ${stage===2?'live':''}" d="M584 267V407H43V333H80"/><g class="node ${stage===0||stage===2?'active':''}" data-stage="0" role="button" tabindex="0" aria-label="Read register operands"><rect class="node-shape" x="80" y="125" width="140" height="234" rx="3"/><text class="diagram-title" x="150" y="151">REGISTERS</text><path d="M90 163H210M90 225H210M90 287H210" stroke="#42658b55" fill="none"/><text class="row-label" x="96" y="190">x1</text><text class="row-value" x="204" y="190">7</text><text class="row-label" x="96" y="252">x3</text><text class="row-value" x="204" y="252">${stage===2?'12':'—'}</text><text class="row-label" x="96" y="315">x2</text><text class="row-value" x="204" y="315">5</text></g><g class="node ${stage===1?'active':''}" data-stage="1" role="button" tabindex="0" aria-label="Execute the addition"><path class="node-shape" d="M330 120L450 170L490 245L450 320L330 370V285L365 245L330 205Z"/><text class="diagram-title" x="418" y="232">ALU</text><text class="result" x="418" y="264">+</text><text class="diagram-alias" x="417" y="286">7 + 5</text></g><g class="node ${stage===2?'active':''}" data-stage="2" role="button" tabindex="0" aria-label="Write the result back to x3"><rect class="node-shape" x="555" y="222" width="58" height="46" rx="3"/><text class="result" x="584" y="252">${stage>=1?'12':'—'}</text></g><text class="diagram-small" x="239" y="152">READ 1</text><text class="diagram-small" x="239" y="344">READ 2</text><text class="diagram-small" x="547" y="206">RESULT</text><text class="diagram-small" x="256" y="424">WRITE BACK TO x3</text><circle cx="43" cy="407" r="2" fill="#668caf"/></svg><div class="trace-info"><span>${['READ OPERANDS','EXECUTE','WRITE BACK'][stage]}</span><span class="result-text">${stage===0?'x1 = 7 · x2 = 5':stage===1?'ALU result = 12':'x3 = 12'}</span></div><p class="trace-note">A simplified ADD datapath. Select a component to trace the instruction.</p></div>`}
function gates(){const sum=a^b,carry=a&b;return `<div class="visual"><div class="visual-head"><span>HALF ADDER</span><span>TWO INPUTS / TWO OUTPUTS</span></div><svg class="half-adder" viewBox="0 0 640 420" role="img" aria-label="Half adder with XOR sum and AND carry outputs"><path class="wire ${a?'live':''}" d="M65 100H260L312 120M185 100V270H290"/><path class="wire ${b?'live':''}" d="M65 340H260L290 300M130 340V160H312"/><path class="shape" d="M290 95Q325 140 290 185Q365 193 414 140Q365 87 290 95Z"/><path d="M280 95Q315 140 280 185" fill="none" stroke="#5d85ae"/><path class="shape" d="M290 245H351A45 45 0 0 1 351 335H290Z"/><path class="wire ${sum?'live':''}" d="M414 140H540"/><path class="wire ${carry?'live':''}" d="M396 290H540"/><circle class="led ${sum?'live':''}" cx="547" cy="140" r="5"/><circle class="led ${carry?'live':''}" cx="547" cy="290" r="5"/><text class="gate-label" x="352" y="145">XOR</text><text class="gate-label" x="345" y="295">AND</text><text class="tiny" x="65" y="80">A</text><text class="tiny" x="65" y="367">B</text><text class="tiny" x="502" y="122">SUM</text><text class="tiny" x="502" y="272">CARRY</text><text class="bit" x="590" y="147">${sum}</text><text class="bit" x="590" y="297">${carry}</text></svg><div class="trace-info"><span>SUM = A XOR B</span><span>CARRY = A AND B</span></div><p class="trace-note">Two one-bit inputs become a sum and a carry. A building block of addition.</p></div>`}
function sculpture(){return `<div class="artwork" id="artwork"><div class="art-meta"><span>A STUDY IN SYSTEMS</span><span>COMPUTE / MEMORY / CONNECTION</span></div><div class="sculpture" id="sculpture"><div class="art-lift"><img src="assets/silicon-study.jpg" class="silicon-art" alt="An artistic exploded silicon sculpture in blue glass and copper, with floating circuit layers around a glowing center." width="1254" height="1254" fetchpriority="high"><button class="art-point compute" data-art="datapath" aria-label="Explore the compute layer"><i></i><span>Follow the data</span></button><button class="art-point logic" data-art="gates" aria-label="Explore the logic layer"><i></i><span>Down to the gates</span></button></div></div><div class="art-caption"><span>A little curiosity, layer by layer.</span><button class="art-text" data-view="architecture">Explore the layers</button></div></div>`}
function about(){return `<div class="split artistic-about"><div class="copy"><div class="kicker">Carnegie Mellon / Computer architecture</div><h1 class="art-name">Arav<br><em>Goswami.</em></h1><p class="description art-intro">Curious about the invisible machinery behind everyday software. I like following an idea all the way down to the hardware.</p><div class="actions"><button class="primary" data-view="work">Selected work</button><button class="text-button" data-view="architecture">A closer look</button></div><p class="personal-line">Sensors & motors. Tennis & football.<br>And a dog in the picture.</p></div>${sculpture()}</div>`}

const projects={skimmer:{name:'Skimmer',tags:'FPGA / DATAFLOW / SIGNAL PROCESSING',description:'Exploring FPGA compute and dataflow, alongside the signal-processing chain of a ground receiver.',detail:'<h2>Skimmer</h2><p>The conceptual ground-receiver path is Yagi + LNA, SDR, Doppler correction, QPSK demodulation, and decoding.</p><p>The SDR provides digital I/Q samples. Software compensates for frequency shift before and during demodulation.</p><p class="note">Specific contributions, implementation details, and measured results still need to be added from the original project materials.</p>'},tracker:{name:'Internship tracker',tags:'SOFTWARE / PERSONAL TOOLS',description:'A practical tool for organizing internship applications and keeping track of where things stand.',detail:'<h2>Internship tracker</h2><p>A personal software project for organizing applications and tracking their statuses.</p><p>An illustrative workflow is Explore, Applied, In conversation, and Decision. Private application data is not connected.</p><p class="note">Implementation details, screenshots, and specific contributions still need to be added from the original project.</p>'}};
function projectVisual(){return project==='skimmer'?`<div class="project-visual"><svg viewBox="0 0 570 320" role="img" aria-label="Conceptual Skimmer data path"><g fill="none" stroke="#547da5"><rect x="35" y="105" width="120" height="110" rx="3"/><rect x="225" y="105" width="120" height="110" rx="3"/><rect x="415" y="105" width="120" height="110" rx="3"/><path d="M155 160H225M345 160H415M95 80V105M285 80V105M475 80V105M95 215V256H475V215"/></g><g text-anchor="middle" fill="#bad7ef" font-size="20"><text x="95" y="158">FPGA</text><text x="285" y="158">RF</text><text x="475" y="158">RX</text></g><g text-anchor="middle" fill="#5e87b0" font-size="10"><text x="95" y="181">COMPUTE</text><text x="285" y="181">TRANSMIT</text><text x="475" y="181">RECEIVE</text></g><path class="wire live" d="M155 160H225M345 160H415"/></svg><span class="fig-label">SKIMMER / CONCEPTUAL SYSTEM VIEW</span></div>`:`<div class="project-visual"><svg viewBox="0 0 570 320" role="img" aria-label="Illustrative internship application workflow"><g fill="#10273c" stroke="#486f98"><rect x="60" y="55" width="450" height="215" rx="5"/><path d="M60 95H510M210 95V270M360 95V270" fill="none"/></g><g fill="#7197be" font-size="10"><text x="80" y="80">INTERNSHIP TRACKER</text><text x="80" y="120">EXPLORE</text><text x="230" y="120">APPLIED</text><text x="380" y="120">CONVERSATION</text></g><g fill="#203e5b" stroke="#365c83"><rect x="80" y="139" width="110" height="33" rx="2"/><rect x="80" y="184" width="110" height="33" rx="2"/><rect x="230" y="139" width="110" height="33" rx="2"/><rect x="380" y="139" width="110" height="33" rx="2"/></g><g stroke="#6f92b1" opacity=".5"><path d="M92 150H155M92 195H155M242 150H305M392 150H455"/></g></svg><span class="fig-label">ILLUSTRATIVE WORKFLOW / PRIVATE DATA NOT CONNECTED</span></div>`}
function work(){const p=projects[project];return `<div class="split"><div class="copy"><div class="kicker">Selected work</div><div class="project-list"><button data-project="skimmer" class="${project==='skimmer'?'active':''}">Skimmer</button><button data-project="tracker" class="${project==='tracker'?'active':''}">Internship tracker</button></div><h2 class="project-title">${p.name}</h2><div class="tags">${p.tags}</div><p class="description">${p.description}</p><button class="primary" id="project-notes">Read project notes</button><p class="personal-line">Project contributions and results are still being filled in from the original materials.</p></div>${projectVisual()}</div>`}
function architecture(){return `<div class="split"><div class="copy"><div class="kicker">A little architecture</div><div class="lab-switch"><button data-mode="datapath" class="${mode==='datapath'?'active':''}">Datapath</button><button data-mode="gates" class="${mode==='gates'?'active':''}">Logic gates</button></div><h2>${mode==='datapath'?'Follow the data.<br><span>One step at a time.</span>':'Start with a bit.<br><span>Build from there.</span>'}</h2>${mode==='datapath'?`<div class="stage-readout">${['READ / OPERANDS','EXECUTE / ALU','WRITE / DESTINATION'][stage]}</div><p class="lab-description">${['Read two source registers: x1 contains 7 and x2 contains 5. The operands travel to the ALU.','The arithmetic logic unit adds the operands. 7 + 5 produces a result of 12.','Send the result back to the register file. The destination register x3 now contains 12.'][stage]}</p><div class="step-controls"><button id="step">${stage===2?'Start again':'Step signal'}</button><button id="reset">Reset</button></div><div class="stage-dots" aria-hidden="true">${[0,1,2].map(i=>`<span class="${stage===i?'active':''}"></span>`).join('')}</div><p class="lab-note">A simplified single-instruction datapath, not a full CPU timing model.</p>`:`<p class="lab-description">An XOR gate produces the sum bit. An AND gate produces the carry bit. Flip the inputs to try it.</p><div class="bit-buttons"><button id="toggle-a" aria-pressed="${Boolean(a)}">A<b>${a}</b></button><button id="toggle-b" aria-pressed="${Boolean(b)}">B<b>${b}</b></button></div><p class="output-readout" aria-live="polite">${a} + ${b} = ${a&b}${a^b}₂<br>Sum ${a^b} · Carry ${a&b}</p><p class="lab-note">A half adder: two logic gates, two one-bit inputs.</p>`}</div>${mode==='datapath'?datapath():gates()}</div>`}
function connect(){return `<div class="split"><div class="copy"><div class="kicker">The next connection</div><h2>Let’s talk<br><span>systems.</span></h2><p class="description">For opportunities, project conversations, and curiosity about how things work.</p><div class="contact-rows"><div>Résumé<small>PDF NOT YET ATTACHED</small></div><div>Email & profiles<small>LINKS NOT YET ADDED</small></div></div><p class="contact-copy">The résumé, professional links, and detailed experience still need to be added before this draft is ready for recruiters.</p></div><svg class="connection-diagram" viewBox="0 0 600 350" role="img" aria-label="Abstract interconnect joining two system nodes"><path d="M130 175H470M130 175V85H300V175M300 175V265H470V175"/><path class="pulse" d="M130 175H470M130 175V85H300V175M300 175V265H470V175"/><circle cx="130" cy="175" r="40"/><circle cx="470" cy="175" r="40"/><circle cx="300" cy="175" r="12"/><text x="130" y="179">ARAV</text><text x="470" y="179">YOU</text></svg></div>`}
function show(view,update=true){const priorFocus=panel.contains(document.activeElement)?document.activeElement.id:null;active=['about','work','architecture','connect'].includes(view)?view:'about';panel.innerHTML={about,work,architecture,connect}[active]();panel.classList.remove('entering');void panel.offsetWidth;panel.classList.add('entering');panel.setAttribute('aria-labelledby','tab-'+active);document.querySelectorAll('[role="tab"]').forEach(t=>{t.setAttribute('aria-selected',String(t.dataset.view===active));t.tabIndex=t.dataset.view===active?0:-1});document.querySelector('#footer-label').textContent={about:'A little about me.',work:'Selected projects.',architecture:'A closer look at the building blocks.',connect:'Let’s connect.'}[active];if(update)history.replaceState(null,'','#'+active);if(priorFocus)document.getElementById(priorFocus)?.focus({preventScroll:true})}
document.addEventListener('click',e=>{const art=e.target.closest('[data-art]');if(art){mode=art.dataset.art;stage=0;show('architecture');return}const view=e.target.closest('[data-view]');if(view){e.preventDefault();show(view.dataset.view);return}const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;show('work');return}const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;show('architecture');return}const s=e.target.closest('[data-stage]');if(s){stage=Number(s.dataset.stage);mode='datapath';show('architecture');return}if(e.target.closest('#step')){stage=(stage+1)%3;show('architecture')}if(e.target.closest('#reset')){stage=0;show('architecture')}if(e.target.closest('#toggle-a')){a=1-a;show('architecture')}if(e.target.closest('#toggle-b')){b=1-b;show('architecture')}if(e.target.closest('#project-notes')){document.querySelector('#dialog-content').innerHTML=projects[project].detail;document.querySelector('#dialog').showModal()}});document.querySelector('#close').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['about','work','architecture','connect'],i=ids.indexOf(active),n=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;show(ids[n]);document.querySelector('#tab-'+ids[n]).focus()});panel.addEventListener('keydown',e=>{const s=e.target.closest('[data-stage]');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();stage=Number(s.dataset.stage);mode='datapath';show('architecture')}});addEventListener('hashchange',()=>show(location.hash.slice(1),false));document.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches||e.pointerType==='touch')return;const el=document.querySelector('#sculpture');if(!el)return;const rect=el.getBoundingClientRect(),dx=(e.clientX-(rect.left+rect.width/2))/rect.width,dy=(e.clientY-(rect.top+rect.height/2))/rect.height;el.style.setProperty('--tilt-x',Math.max(-3,Math.min(3,-dy*4))+'deg');el.style.setProperty('--tilt-y',Math.max(-3,Math.min(3,dx*4))+'deg')});show(location.hash.slice(1)||'about');
</script></body></html>
