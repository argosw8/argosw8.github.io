</style></head><body><main class="terminal"><header class="identity"><div class="wrap"><div class="topline"><span>PERSONAL PORTFOLIO</span><button class="resume" data-command="resume">Résumé</button></div><h1>ARAV GOSWAMI</h1><p class="subtitle">Carnegie Mellon University · Computer architecture</p><nav class="sections" aria-label="Portfolio sections"><button data-command="about" class="section-button active" aria-pressed="true">ABOUT</button><button data-command="experience" class="section-button" aria-pressed="false">EXPERIENCE</button><button data-command="projects" class="section-button" aria-pressed="false">PROJECTS</button><button data-command="research" class="section-button" aria-pressed="false">RESEARCH</button><button data-command="education" class="section-button" aria-pressed="false">EDUCATION</button></nav></div></header><section class="transcript" id="transcript" aria-label="Terminal output" tabindex="0"><div class="wrap history" id="history" aria-live="polite" aria-relevant="additions"></div></section><footer class="promptbar"><div class="wrap prompt-inner"><form class="command-form" id="command-form"><label for="command-input">arav@cmu ~ $</label><input id="command-input" type="text" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a section name or help" enterkeyhint="go"></form><div class="tips"><span><code>↑ ↓</code> history</span><span><code>Tab</code> complete</span><span><code>Ctrl+L</code> clear</span><span><code>help</code> commands</span><span class="footer-mark">HARDWARE / SOFTWARE</span></div></div></footer></main><script>
const historyEl=document.querySelector('#history'),transcript=document.querySelector('#transcript'),input=document.querySelector('#command-input');let commandHistory=[],historyIndex=0;
const sections={
about:`<h2>ABOUT</h2><p>I’m part of the <strong>Carnegie Mellon community.</strong> I’m interested in computer architecture and how the hardware beneath our software works.</p><p>I also like messing with sensors and motors, watching tennis and football, and life with a dog.</p><div class="tagline"><span>Computer architecture</span><span>·</span><span>Hardware + software</span><span>·</span><span>Hands-on tinkering</span></div>`,
experience:`<h2>EXPERIENCE</h2><div class="rows"><article class="row"><h3>Hardware & dataflow</h3><p>Skimmer, FPGA compute, and the path a signal takes through a system.</p></article><article class="row"><h3>Practical software</h3><p>A personal internship tracker for organizing applications and statuses.</p></article><article class="row"><h3>Physical systems</h3><p>Hands-on curiosity about sensors, motors, and making things respond to code.</p></article></div><p class="note">Role details, organizations, dates, and achievements pending the actual résumé.</p>`,
projects:`<h2>PROJECTS</h2><div class="rows"><article class="row"><button class="command-link" data-command="skimmer">Skimmer</button><div class="label">FPGA / DATAFLOW / SIGNALS</div><p>Exploring FPGA compute and dataflow, alongside the signal-processing chain of a ground receiver.</p></article><article class="row"><button class="command-link" data-command="tracker">Internship tracker</button><div class="label">SOFTWARE / PERSONAL TOOLS</div><p>A practical tool for organizing internship applications and keeping track of their statuses.</p></article></div><p class="note">Select a project or type skimmer / tracker for notes.</p>`,
research:`<h2>RESEARCH</h2><h3>Research interests</h3><p>Computer architecture connects my interests in hardware, software, and dataflow.</p><ul><li>How does an architecture shape the way data moves?</li><li>Where should work happen—in hardware, software, or both?</li><li>How do simple building blocks become a useful system?</li></ul>`,
education:`<h2>EDUCATION</h2><h3>Carnegie Mellon University</h3><p>Part of the CMU community, with an interest in computer architecture and the connection between hardware and software.</p><div class="tagline"><span>Computer architecture</span><span>·</span><span>FPGA & dataflow</span><span>·</span><span>Sensors & motors</span></div><p class="note">Degree, dates, and coursework pending the actual résumé.</p>`,
skimmer:`<h2>SKIMMER</h2><div class="label">FPGA / DATAFLOW / SIGNALS</div><p>Exploring FPGA compute and dataflow, alongside a ground-receiver signal-processing chain.</p><h3>Conceptual receiver path</h3><p>Yagi + LNA → SDR → Doppler correction → QPSK demodulation → Decoding</p><p>The SDR provides digital I/Q samples. Software compensates for frequency shift before and during demodulation.</p><p class="note">Specific contributions, implementation details, and measured results still need the original project materials.</p>`,
tracker:`<h2>INTERNSHIP TRACKER</h2><div class="label">SOFTWARE / PERSONAL TOOLS</div><p>A practical tool for organizing internship applications and tracking their statuses.</p><h3>Illustrative workflow</h3><p>Explore → Applied → In conversation → Decision</p><p class="note">Private application data is not connected. Implementation details, screenshots, and specific contributions still need to be added from the original project.</p>`,
resume:`<h2>RÉSUMÉ</h2><p>Résumé PDF not attached.</p><p>Preferred email, GitHub, and LinkedIn links pending.</p><p class="note">Verified experience, dates, and project results will be added from the original records.</p>`,
help:`<h2>COMMANDS</h2><div class="command-table"><strong>about</strong><span>Background and interests</span><strong>experience</strong><span>Current work and activities</span><strong>projects</strong><span>Selected projects</span><strong>research</strong><span>Research interests</span><strong>education</strong><span>Carnegie Mellon</span><strong>skimmer</strong><span>Skimmer project notes</span><strong>tracker</strong><span>Internship tracker notes</span><strong>resume</strong><span>Résumé and contact status</span><strong>ls</strong><span>List sections</span><strong>clear</strong><span>Clear the transcript</span><strong>history</strong><span>Command history</span><strong>help</strong><span>Show commands</span></div><p class="note">Aliases: open projects · cat about · cd education</p>`};
function mark(name){if(['skimmer','tracker'].includes(name))name='projects';document.querySelectorAll('.sections button').forEach(b=>{const active=b.dataset.command===name;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
function append(raw,html,text){const entry=document.createElement('section');entry.className='entry';const echo=document.createElement('div');echo.className='echo';const prompt=document.createElement('span');prompt.className='echo-prompt';prompt.textContent='arav@cmu ~ $';const value=document.createElement('span');value.textContent=raw;echo.append(prompt,value);const out=document.createElement('div');out.className='output';if(html)out.innerHTML=html;else{const p=document.createElement('div');p.className='plain-text';p.textContent=text||'';out.append(p)}entry.append(echo,out);historyEl.append(entry);requestAnimationFrame(()=>{transcript.scrollTop=Math.max(0,entry.offsetTop-transcript.offsetTop-22)})}
function execute(raw,options={}){const trimmed=raw.trim();if(!trimmed)return;const silent=options.silent||false;if(!silent){commandHistory.push(trimmed);historyIndex=commandHistory.length}input.value='';let name=trimmed.toLowerCase().replace(/^(open|cat|cd)\s+/,'').replace(/\/$/,'');const aliases={'résumé':'resume','cv':'resume','contact':'resume','internship-tracker':'tracker','whoami':'about','home':'about','intro':'about'};name=aliases[name]||name;if(name==='clear'){historyEl.replaceChildren();mark('');history.replaceState(null,'','#terminal');return}if(name==='ls'){append(trimmed,null,'ABOUT    EXPERIENCE    PROJECTS    RESEARCH    EDUCATION');mark('');return}if(name==='history'){append(trimmed,null,commandHistory.map((c,i)=>(i+1)+'  '+c).join('\n'));return}if(sections[name]){append(trimmed,sections[name]);mark(name);history.replaceState(null,'','#'+name)}else append(trimmed,null,'Unknown command: '+trimmed+'\nType help for available commands.');if(!options.noFocus)input.focus({preventScroll:true})}
document.querySelector('#command-form').onsubmit=e=>{e.preventDefault();execute(input.value)};document.addEventListener('click',e=>{const button=e.target.closest('[data-command]');if(button)execute(button.dataset.command)});input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=commandHistory[historyIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(commandHistory.length,historyIndex+1);input.value=commandHistory[historyIndex]||''}if(e.key==='Tab'){e.preventDefault();const value=input.value.toLowerCase(),prefix=value.match(/^(open|cat|cd)\s+/)?.[0]||'',query=value.slice(prefix.length),choices=[...Object.keys(sections),'ls','clear','history'];const found=choices.filter(x=>x.startsWith(query));if(found.length===1)input.value=prefix+found[0];else if(found.length>1&&query)append('complete '+query,null,found.join('   '))}});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();execute('clear');input.focus({preventScroll:true})}if(e.key==='Escape'){input.value='';input.focus({preventScroll:true})}});const route=location.hash.slice(1).toLowerCase();execute(sections[route]?route:'about',{silent:true,noFocus:true});if(matchMedia('(pointer:fine)').matches)input.focus({preventScroll:true});
</script></body></html>
