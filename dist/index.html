<path class="gate-shape" d="M660 357H700A37 37 0 0 1 700 431H660Z"/><text class="gate-name" x="693" y="398">AND</text><text class="expression" x="693" y="453">¬A · B</text></g><g class="output-button" data-select="1" role="button" tabindex="0" aria-label="Explore Projects"><rect class="output-target" x="825" y="370" width="148" height="48" rx="4"/><circle class="output-led" cx="844" cy="394" r="3"/><text class="output-label" x="859" y="398">Projects</text><text class="output-bit" data-bit="o1" x="960" y="398">0</text></g><g class="and-gate" data-output="2"><path class="gate-shape" d="M660 469H700A37 37 0 0 1 700 543H660Z"/><text class="gate-name" x="693" y="510">AND</text><text class="expression" x="693" y="565">A · ¬B</text></g><g class="output-button" data-select="2" role="button" tabindex="0" aria-label="Explore Outside"><rect class="output-target" x="825" y="482" width="148" height="48" rx="4"/><circle class="output-led" cx="844" cy="506" r="3"/><text class="output-label" x="859" y="510">Outside</text><text class="output-bit" data-bit="o2" x="960" y="510">0</text></g><g class="and-gate" data-output="3"><path class="gate-shape" d="M660 581H700A37 37 0 0 1 700 655H660Z"/><text class="gate-name" x="693" y="622">AND</text><text class="expression" x="693" y="677">A · B</text></g><g class="output-button" data-select="3" role="button" tabindex="0" aria-label="Explore Connect"><rect class="output-target" x="825" y="594" width="148" height="48" rx="4"/><circle class="output-led" cx="844" cy="618" r="3"/><text class="output-label" x="859" y="622">Connect</text><text class="output-bit" data-bit="o3" x="960" y="622">0</text></g><text class="tiny-label" x="35" y="232" text-anchor="start">INPUTS</text></svg><div class="board-foot"><span id="state-label">ADDRESS 00 · ABOUT</span><div class="legend"><span>0 / LOW</span><span>1 / HIGH</span></div></div><div class="input-controls" aria-label="Toggle circuit inputs"><button id="toggle-a" aria-label="Toggle input A">A <b id="bit-a">0</b></button><button id="toggle-b" aria-label="Toggle input B">B <b id="bit-b">0</b></button><span class="keyboard-hint">KEYS A / B</span></div></section><section class="story" id="story" aria-live="polite" aria-label="Selected output"></section></div><footer class="footer"><span class="caption">Toggle the inputs, or choose an output. The circuit carries you there.</span><div class="controls"><button id="logic">See the logic</button><button id="pause" aria-pressed="false">Pause signals</button></div></footer></main><dialog id="dialog"><div class="dialog-head"><span id="dialog-label">CIRCUIT NOTES</span><button id="close" class="close" aria-label="Close details">×</button></div><div id="dialog-content"></div></dialog><script>
let a=0,b=0,selected=0,project='skimmer',timer=null;const story=document.querySelector('#story'),app=document.querySelector('#app');
const records={skimmer:{name:'Skimmer',tags:'FPGA / DATAFLOW / SIGNAL PROCESSING',body:'FPGA compute, dataflow, and a ground receiver. Exploring how information moves through a system.',detail:'<h2>Skimmer</h2><p>A project involving FPGA compute and dataflow, alongside a conceptual ground-receiver signal-processing chain.</p><div class="mini-flow">Yagi + LNA → SDR → Doppler correction → QPSK → Decoding</div><p>The SDR supplies digital I/Q samples. Receiver software corrects frequency shift before and during demodulation. Error-correction decoding follows.</p><p class="note">Specific contributions, implementation details, and measured results still need to be added from the original project materials.</p>'},tracker:{name:'Internship tracker',tags:'SOFTWARE / PERSONAL TOOLS',body:'A practical place to organize applications and keep track of where things stand.',detail:'<h2>Internship tracker</h2><p>A personal software project for organizing internship applications and tracking their statuses.</p><div class="mini-flow">Explore → Applied → In conversation → Decision</div><p>The workflow is illustrative. Private application data is not connected.</p><p class="note">Implementation details, screenshots, and specific contributions still need to be added from the original project materials.</p>'}};
function render(){const address=''+a+b;let content='';if(selected===0)content='<div class="address">OUT[00] / ABOUT</div><h1>Hi, I’m Arav.<br><span>Let’s start small.</span></h1><p>I’m part of the <strong>Carnegie Mellon community.</strong> I’m interested in computer architecture, and how a few simple primitives become a system.</p><p>This experience starts with two inputs and a handful of logic gates. Flip a bit. See where it leads.</p><div class="story-actions"><button class="link-button" data-select="1">Send a signal to my work</button></div><p class="note">COMPUTER ARCHITECTURE / HARDWARE + SOFTWARE</p>';if(selected===1){const p=records[project];content=`<div class="address">OUT[01] / PROJECTS</div><div class="project-picker"><button data-project="skimmer" class="${project==='skimmer'?'active':''}">Skimmer</button><button data-project="tracker" class="${project==='tracker'?'active':''}">Internship tracker</button></div><h2>${p.name}</h2><div class="tags">${p.tags}</div><p>${p.body}</p><div class="story-actions"><button class="link-button" id="project-detail">Open project record</button><button class="link-button" data-select="2">Beyond the work</button></div><p class="note">PROJECT DETAILS ARE STILL BEING FILLED IN.</p>`}if(selected===2)content='<div class="address">OUT[10] / OUTSIDE</div><h2>More than<br><span>the workbench.</span></h2><p>I like messing with sensors and motors. I also like watching tennis and football. And there’s a dog in my life, too.</p><div class="interest-buttons"><button class="active" data-interest="tinker">Tinkering</button><button data-interest="sports">Match day</button><button data-interest="dog">My dog</button></div><p class="interest-note" id="interest-note">The satisfying moment when code makes something physical move.</p><button class="link-button" data-select="3">Make a connection</button>';if(selected===3)content='<div class="address">OUT[11] / CONNECT</div><h2>The next<br><span>connection.</span></h2><p>For opportunities, project conversations, and people who also like figuring out how things work.</p><div class="contact-rows"><div>Résumé<small>PDF NOT YET ATTACHED</small></div><div>Email & profiles<small>LINKS NOT YET ADDED</small></div></div><p class="note">This is a draft experience. Résumé, professional links, and detailed project contributions are still needed before sharing with recruiters.</p>';story.innerHTML='<div class="story-inner">'+content+'</div>';document.querySelector('#state-label').textContent='ADDRESS '+address+' · '+['ABOUT','PROJECTS','OUTSIDE','CONNECT'][selected];history.replaceState(null,'','#'+['about','projects','outside','connect'][selected])}
function update(delay=true){clearTimeout(timer);const v={a,b,na:1-a,nb:1-b,o0:(1-a)&(1-b),o1:(1-a)&b,o2:a&(1-b),o3:a&b};selected=a*2+b;document.querySelectorAll('[data-net]').forEach(el=>el.classList.toggle('high',Boolean(v[el.dataset.net])));document.querySelectorAll('[data-bit]').forEach(el=>el.textContent=v[el.dataset.bit]);document.querySelectorAll('[data-output]').forEach(el=>el.classList.toggle('active',Number(el.dataset.output)===selected));document.querySelectorAll('.output-button').forEach(el=>{const active=Number(el.dataset.select)===selected;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});document.querySelector('#bit-a').textContent=a;document.querySelector('#bit-b').textContent=b;document.querySelector('#toggle-a').setAttribute('aria-pressed',String(Boolean(a)));document.querySelector('#toggle-b').setAttribute('aria-pressed',String(Boolean(b)));if(delay){app.classList.add('propagating');timer=setTimeout(()=>{app.classList.remove('propagating');render()},220)}else render()}
function select(i){a=(i>>1)&1;b=i&1;update()}function toggle(which){if(which==='a')a=1-a;else b=1-b;update()}document.querySelector('#toggle-a').onclick=()=>toggle('a');document.querySelector('#toggle-b').onclick=()=>toggle('b');document.addEventListener('click',e=>{const out=e.target.closest('[data-select]');if(out)select(Number(out.dataset.select));const t=e.target.closest('[data-toggle]');if(t)toggle(t.dataset.toggle);const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;render()}const i=e.target.closest('[data-interest]');if(i){document.querySelectorAll('[data-interest]').forEach(el=>el.classList.toggle('active',el===i));document.querySelector('#interest-note').textContent={tinker:'The satisfying moment when code makes something physical move.',sports:'Tennis and football are what I like to watch off the workbench.',dog:'There’s a dog in my life. A good reason to step away from the screen.'}[i.dataset.interest]}if(e.target.closest('#project-detail'))openDialog(records[project].detail,'PROJECT RECORD')});document.querySelectorAll('svg [role="button"]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(el.dataset.select!==undefined)select(Number(el.dataset.select));else toggle(el.dataset.toggle)}}));function openDialog(html,label){document.querySelector('#dialog-content').innerHTML=html;document.querySelector('#dialog-label').textContent=label;document.querySelector('#dialog').showModal()}document.querySelector('#logic').onclick=()=>openDialog('<h2>A real 2-to-4 decoder.</h2><p>Inputs A and B select exactly one output. Two NOT gates provide inverted signals. Four AND gates combine them into four possible paths.</p><table><thead><tr><th>A</th><th>B</th><th>High output</th><th>Expression</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>About</td><td>¬A · ¬B</td></tr><tr><td>0</td><td>1</td><td>Projects</td><td>¬A · B</td></tr><tr><td>1</td><td>0</td><td>Outside</td><td>A · ¬B</td></tr><tr><td>1</td><td>1</td><td>Connect</td><td>A · B</td></tr></tbody></table><p class="note">Bright wires carry 1; dim wires carry 0. Dots indicate electrical connections. Crossing wires without a dot are not connected. The short reveal delay is a visual effect, not a physical timing simulation.</p>','CIRCUIT NOTES');document.querySelector('#close').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});document.querySelector('#pause').onclick=e=>{const p=app.classList.toggle('paused');e.currentTarget.textContent=p?'Resume signals':'Pause signals';e.currentTarget.setAttribute('aria-pressed',String(p))};document.addEventListener('keydown',e=>{if(document.querySelector('#dialog').open||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key.toLowerCase()==='a')toggle('a');if(e.key.toLowerCase()==='b')toggle('b')});let initial=['about','projects','outside','connect'].indexOf(location.hash.slice(1));if(initial<0)initial=0;a=(initial>>1)&1;b=initial&1;update(false);
</script></body></html>
